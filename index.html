<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Dynamic Logo Plugin (export test)</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: -apple-system, sans-serif;
    background: #fff;
  }
  #wrap {
    display: flex;
    flex-direction: column;
    height: 100%;
  }
  #imgWrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
  }
  img {
    max-width: 100%;
    max-height: 100%;
  }
  #status {
    color: #888;
    font-size: 12px;
    text-align: center;
    padding: 8px;
  }
  #debug {
    font-family: monospace;
    font-size: 10px;
    white-space: pre-wrap;
    background: #f5f5f5;
    border-top: 1px solid #ddd;
    padding: 6px;
    max-height: 40%;
    overflow: auto;
    color: #333;
  }
</style>
</head>
<body>
  <div id="wrap">
    <div id="imgWrap">
      <div id="status">loading plugin SDK…</div>
      <img id="logo" style="display:none" />
    </div>
    <div id="debug">debug: waiting…</div>
  </div>

  <script type="module">
    const HARDCODED_TEST_URL =
      'https://4uumoyezeg.execute-api.us-west-2.amazonaws.com/default/getMaps?imageKey=MIDWEST.JPG';

    const statusEl = document.getElementById('status');
    const imgEl = document.getElementById('logo');
    const debugEl = document.getElementById('debug');

    let fireCount = 0;
    function log(obj) {
      fireCount++;
      const ts = new Date().toISOString().split('T')[1].replace('Z', '');
      debugEl.textContent = '[' + ts + '] fire #' + fireCount + '\n' + JSON.stringify(obj, null, 2);
    }

    function setStatus(text) {
      statusEl.textContent = text;
      statusEl.style.display = 'block';
      imgEl.style.display = 'none';
    }

    function showImage(url) {
      imgEl.src = url;
      imgEl.style.display = 'block';
      statusEl.style.display = 'none';
    }

    showImage(HARDCODED_TEST_URL);

    try {
      const { client } = await import('https://esm.sh/@sigmacomputing/plugin');

      client.config.configureEditorPanel([
        { name: 'data source', type: 'element' },
        { name: 'image url column', type: 'column', source: 'data source' },
      ]);

      let subscribed = false;

      client.config.subscribe(() => {
        const dataSourceConfig = client.config.getKey('data source');
        const elementId = dataSourceConfig && dataSourceConfig.value;
        if (!elementId) {
          log({ note: 'no data source configured yet' });
          return;
        }
        if (subscribed) {
          // avoid stacking duplicate subscriptions on repeated config fires
          return;
        }
        subscribed = true;

        client.elements.subscribeToElementData(elementId, (data) => {
          const colConfig = client.config.getKey('image url column');
          const colId = colConfig && colConfig.value;

          log({
            elementId,
            colId,
            rowCountForColumn: colId && data[colId] ? data[colId].length : null,
            allValuesForColumn: colId ? data[colId] : null,
            allColumnKeysInData: Object.keys(data),
          });

          if (!colId) {
            setStatus('select an "image url column" in the editor panel');
            return;
          }
          const values = data[colId];
          const url = values && values[0];
          if (url) {
            showImage(url);
          } else {
            setStatus('no url value found in first row of "' + colId + '"');
          }
        });
      });
    } catch (err) {
      log({ error: err && err.message ? err.message : String(err) });
      console.error(err);
    }
  </script>
</body>
</html>
