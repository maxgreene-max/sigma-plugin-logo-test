<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Dynamic Logo Plugin (export test)</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
    font-family: -apple-system, sans-serif;
  }
  img {
    max-width: 100%;
    max-height: 100%;
  }
  #status {
    color: #888;
    font-size: 12px;
    text-align: center;
    padding: 8px;
  }
</style>
</head>
<body>
  <div id="status">loading plugin SDK…</div>
  <img id="logo" style="display:none" />

  <script type="module">
    // Same public URL used to reproduce SIG-90372 (PermaPlate's dynamic image URL bug).
    // Swap this for KKR's Pitchbook logo URL, or wire up the editor-panel config below
    // once you want to test the real workbook-driven (dynamic/filtered) case.
    const HARDCODED_TEST_URL =
      'https://4uumoyezeg.execute-api.us-west-2.amazonaws.com/default/getMaps?imageKey=MIDWEST.JPG';

    const statusEl = document.getElementById('status');
    const imgEl = document.getElementById('logo');

    function setStatus(text) {
      statusEl.textContent = text;
      statusEl.style.display = 'block';
      imgEl.style.display = 'none';
    }

    function showImage(url) {
      imgEl.src = url;
      imgEl.style.display = 'block';
      statusEl.style.display = 'none';
    }

    // Render immediately with the hardcoded URL — no workbook data source required.
    showImage(HARDCODED_TEST_URL);

    // Optional upgrade path: if you later add a Table/Input Table with the real
    // dynamic URL column, this wires the plugin's editor panel to read from it and
    // will override the hardcoded image once configured.
    try {
      const { client } = await import('https://esm.sh/@sigmacomputing/plugin');

      client.config.configureEditorPanel([
        { name: 'data source', type: 'element' },
        { name: 'image url column', type: 'column', source: 'data source' },
      ]);

      client.config.subscribe(() => {
        const dataSourceConfig = client.config.getKey('data source');
        const elementId = dataSourceConfig && dataSourceConfig.value;
        if (!elementId) {
          return; // not configured yet — keep showing the hardcoded test image
        }

        client.elements.subscribeToElementData(elementId, (data) => {
          const colConfig = client.config.getKey('image url column');
          const colId = colConfig && colConfig.value;
          if (!colId) return;
          const values = data[colId];
          const url = values && values[0];
          if (url) {
            showImage(url);
          } else {
            setStatus('no url value found in first row of "' + colId + '"');
          }
        });
      });
    } catch (err) {
      console.error('Plugin SDK config failed (hardcoded image still shown):', err);
    }
  </script>
</body>
</html>
